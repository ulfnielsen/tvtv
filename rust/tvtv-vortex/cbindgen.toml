# cbindgen.toml — config for generating rust/tvtv-vortex/include/tvtv_vortex.h
# from src/lib.rs. Invoked by scripts/build-rust.sh:
#   cbindgen --config cbindgen.toml --crate tvtv-vortex --output include/tvtv_vortex.h
#
# Goal: shape the generated header (include guard, extern "C" block,
# stdint.h/stddef.h includes, doc comments) cleanly enough that it reads
# as a proper, hand-checkable C ABI surface, not just cbindgen's raw
# default output.

language = "C"

header = "/* tvtv_vortex.h — GENERATED by cbindgen from rust/tvtv-vortex/src/lib.rs.\n * See that file for the authoritative signatures and ownership contract. */"
autogen_warning = "/* DO NOT EDIT BY HAND. Edit rust/tvtv-vortex/src/lib.rs and re-run scripts/build-rust.sh (or cbindgen directly) to regenerate this file. */"

include_guard = "TVTV_VORTEX_FFI_H"
sys_includes = ["stdint.h", "stddef.h"]
no_includes = true
cpp_compat = true
line_length = 100
tab_width = 4
documentation = true
documentation_style = "c"
style = "type"

[export]
prefix = ""

[fn]
prefix = ""
args = "auto"
rename_args = "None"

[parse]
parse_deps = false
